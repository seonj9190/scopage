# Nginx site config for the Express server (server.cjs).
# Install to /etc/nginx/sites-available/scopage and symlink into sites-enabled,
# then let certbot fill in the SSL directives (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name seogwipochamber.org www.seogwipochamber.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
